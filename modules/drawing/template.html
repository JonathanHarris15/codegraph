<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>codegraph</title>
<style>
/* Columns run left to right: whoever imports sits left of whoever is imported.
   Folder colours are generated from the folder's position, so any codebase
   gets a usable palette without anyone picking one. */
:root{
  --bg:#eceef3; --grid:#dfe3ea; --surface:#fff; --surface-2:#f6f7fa;
  --ink:#121820; --muted:#5d6878; --hair:#ced5e0; --hair-soft:#e3e8f0;
  --accent:#2f5fe0; --on-accent:#fff;
  --w-import:#8c97a8; --w-lazy:#9aa5b6; --breach:#cf3434;
  --sat:58%; --lig:38%;
  --font-ui:ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --grid:#161d26; --surface:#161d26; --surface-2:#1c2531;
  --ink:#e4ebf4; --muted:#8c98a9; --hair:#2b3644; --hair-soft:#222c38;
  --accent:#6f9bff; --on-accent:#0d1117;
  --w-import:#6d7a8c; --w-lazy:#5c6878; --breach:#ff6e6e;
  --sat:62%; --lig:68%;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1117; --grid:#161d26; --surface:#161d26; --surface-2:#1c2531;
  --ink:#e4ebf4; --muted:#8c98a9; --hair:#2b3644; --hair-soft:#222c38;
  --accent:#6f9bff; --on-accent:#0d1117;
  --w-import:#6d7a8c; --w-lazy:#5c6878; --breach:#ff6e6e;
  --sat:62%; --lig:68%;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#shell{display:flex;flex-direction:column;height:100%}

header{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--hair);z-index:4}
h1{margin:0;font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.counts{font-family:var(--font-mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:0}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
input[type=search]{font-family:var(--font-mono);font-size:12px;width:140px;
  padding:5px 8px;border:1px solid var(--hair);border-radius:6px;
  background:var(--surface-2);color:var(--ink)}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{font:inherit;font-size:12px;font-weight:500;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--hair);border-radius:6px;
  padding:5px 9px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;cursor:grab;
  touch-action:none;background-image:radial-gradient(var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#stage.panning{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;
  user-select:none;-webkit-user-select:none}
#canvas.moving{will-change:transform}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

.colhead{position:absolute;font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.04em;color:var(--gc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead::after{content:"";display:block;margin-top:5px;height:2px;border-radius:1px;
  background:currentColor;opacity:.4}

.card{position:absolute;width:170px;background:var(--surface);
  border:1px solid var(--hair);border-left:3px solid var(--gc);border-radius:7px;
  padding:7px 9px 8px;cursor:grab;--stack:0 1px 2px rgba(10,20,40,.06);box-shadow:var(--stack);
  transition:opacity .14s,box-shadow .14s}
.card:active{cursor:grabbing}
.card .nm{font-family:var(--font-mono);font-size:calc(9px + 3px*var(--s,1));font-weight:500;line-height:1.25;
  word-break:break-word}
.card .dir{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-top:1px;
  word-break:break-all}
.card .foot{margin-top:5px;font-family:var(--font-mono);font-size:9.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.card.ext{border:1px dashed var(--gc);border-left:3px solid var(--gc);background:var(--surface-2)}
.card.dim{opacity:.15}
.card.hov{box-shadow:0 0 0 1px var(--accent),var(--stack)}
.card.sel{box-shadow:0 0 0 2px var(--accent),0 4px 12px rgba(10,20,40,.14),var(--stack)}
.card.near{box-shadow:0 0 0 1px var(--accent),var(--stack)}
.card.hit{box-shadow:0 0 0 2px var(--w-lazy),var(--stack)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.picked{outline:2px solid var(--accent);outline-offset:3px}
#stage.boxing{cursor:crosshair}
#marquee{position:absolute;z-index:2;pointer-events:none;border:1px dashed var(--accent);
  border-radius:3px;background:color-mix(in srgb,var(--accent) 10%,transparent)}

path.wire{fill:none;stroke-linecap:round;transition:opacity .14s}
path.wire.dim{opacity:.06}
path.wire.hot{stroke-width:2.2;opacity:1}
/* while a wire draws itself on, its arrowhead waits at the far end instead of
   hanging there ahead of the line */
path.wire.drawing{marker-end:none;marker-start:none}
#b-wires[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

#panel{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));
  width:266px;max-height:calc(100% - 68px);overflow:auto;background:var(--surface);
  border:1px solid var(--hair);border-radius:9px;padding:12px 13px 14px;z-index:3;
  box-shadow:0 6px 22px rgba(10,20,40,.13)}
#panel h2{margin:0;font-family:var(--font-mono);font-size:13px;font-weight:700;
  word-break:break-all;line-height:1.3;color:var(--gc,var(--ink))}
#panel .ppath{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px;
  word-break:break-all}
#panel .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-family:var(--font-mono);
  font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
#panel h3{margin:13px 0 5px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
#panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#panel li button{width:100%;text-align:left;font-family:var(--font-mono);font-size:10.5px;
  padding:3px 6px;display:flex;align-items:center;gap:6px}
#panel .dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
#panel .close{position:absolute;top:9px;right:10px;padding:2px 7px}

#legend{position:absolute;bottom:max(12px,env(safe-area-inset-bottom,0px));
  left:max(12px,env(safe-area-inset-left,0px));background:var(--surface);
  border:1px solid var(--hair);border-radius:9px;padding:9px 11px 10px;z-index:3;
  box-shadow:0 4px 14px rgba(10,20,40,.1);font-size:10.5px;color:var(--muted);max-width:290px}
#legend-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;margin:0 0 6px;padding:0;border:0;background:none;font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#legend-toggle:hover{color:var(--ink)}
#legend-toggle .chev{font-size:11px;transition:transform .14s}
#legend.closed #legend-toggle{margin:0}
#legend.closed #legend-toggle .chev{transform:rotate(180deg)}
#legend.closed #legend-body{display:none}
#legend .shapes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:7px;padding-bottom:7px;
  border-bottom:1px solid var(--hair-soft);color:var(--ink)}
#legend .shapes span{margin-right:8px}
#legend .shapes i{flex:0 0 auto;display:block}
.s-mod{width:17px;height:12px;border:1px solid var(--muted);border-radius:3px;
  background:linear-gradient(var(--hair) 0 0) top/100% 4px no-repeat,var(--surface);
  box-shadow:2px 2px 0 -1px var(--surface),2px 2px 0 0 var(--muted)}
.s-file{width:11px;height:13px;background:var(--muted);
  clip-path:polygon(0 0,62% 0,100% 32%,100% 100%,0 100%)}
.s-ext{width:17px;height:12px;border:1px dashed var(--muted);border-radius:3px}
.s-feat{width:19px;height:11px;border:1px solid var(--muted);border-radius:6px}
.s-page{width:17px;height:12px;border:1px solid var(--muted);border-top-width:4px;border-radius:2px}
.s-comp{width:15px;height:11px;border:1px dashed var(--muted);border-radius:2px}
.s-store{width:14px;height:13px;border:1px solid var(--muted);border-radius:50% 50% 3px 3px/5px 5px 3px 3px}
#legend .row{display:flex;align-items:center;gap:6px;color:var(--ink);margin-bottom:3px}
#legend .gen{margin-top:7px;padding-top:6px;border-top:1px solid var(--hair-soft);
  font-family:var(--font-mono);font-size:9.5px}
#legend .key{margin-top:7px;padding-top:6px;border-top:1px solid var(--hair-soft);
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;
  max-height:142px;overflow:auto}
#legend .key span{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);
  font-size:9.5px;color:var(--ink);min-width:0}
#legend .key i{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
#legend .key b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* module views */
#crumbs{font-family:var(--font-mono);font-size:14px;color:var(--muted);white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
#crumbs button{font-family:var(--font-mono);font-size:14px;padding:2px 4px;border:0;
  background:none;color:var(--accent)}
#crumbs button:hover{text-decoration:underline}
#crumbs b{color:var(--ink);font-weight:600;padding:2px 4px}
.issues{color:var(--breach)}
#corner{position:absolute;right:max(12px,env(safe-area-inset-right,0px));
  bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:3}
#corner button{background:var(--surface);box-shadow:0 4px 14px rgba(10,20,40,.1)}
/* A module is a stack of files: a coloured band across its head, a second
   sheet showing behind it, its name in plain bold. A file is one sheet with a
   folded corner and a typewriter name. The two read apart at a glance. */
.card.mod{border:1px solid color-mix(in srgb,var(--gc) 55%,var(--hair));padding:0;border-radius:8px}
.card.mod{--stack:5px 5px 0 -1px var(--surface),5px 5px 0 0 color-mix(in srgb,var(--gc) 40%,var(--hair))}
.card.mod .band{background:color-mix(in srgb,var(--gc) 16%,var(--surface));
  border-radius:7px 7px 0 0;padding:7px 9px 7px;border-bottom:1px solid color-mix(in srgb,var(--gc) 30%,var(--hair))}
.card.mod.folded .band{border-radius:7px;border-bottom:0}
.card.mod .nm{font-family:var(--font-ui);font-size:13px;font-weight:700;color:color-mix(in srgb,var(--gc) 70%,var(--ink))}
.card.mod .dir,.card.mod .foot{color:color-mix(in srgb,var(--gc) 35%,var(--muted))}
.card.mod ul.flist{margin:0;padding:5px 5px 7px;border-top:0}
.card.file{border-top-right-radius:0}
.card.file::before{content:"";position:absolute;top:-1px;right:-1px;width:11px;height:11px;
  background:linear-gradient(225deg,var(--bg) 50%,var(--hair) 50%,var(--hair) calc(50% + 1px),var(--surface-2) calc(50% + 1px));
  border-bottom-left-radius:2px}
.frame{position:absolute;border:1px solid var(--gc);border-radius:12px;pointer-events:none;
  background:color-mix(in srgb,var(--gc) 4%,transparent)}
.frame span{position:absolute;top:5px;left:12px;white-space:nowrap;font-family:var(--font-mono);font-size:11px;
  font-weight:700;letter-spacing:.04em;color:var(--gc)}
.card .hd{display:flex;align-items:flex-start;gap:6px}
.card .hd .nm{flex:1 1 auto;min-width:0}
.card .fold{flex:0 0 auto;padding:0 5px;font-size:10px;line-height:15px;border-radius:4px;
  background:none;border:1px solid transparent;color:var(--muted)}
.card .fold:hover{border-color:var(--hair);color:var(--ink)}
.card .fold{transition:transform .24s ease}
.card .fold[aria-expanded="false"]{transform:rotate(-90deg)}
.card ul.flist{list-style:none;margin:6px 0 0;padding:5px 0 0;border-top:1px solid var(--hair-soft);
  display:flex;flex-direction:column;gap:1px}
.card ul.flist li{font-family:var(--font-mono);font-size:10.5px;padding:1px 4px;border-radius:3px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card ul.flist li:hover{background:var(--surface-2);color:var(--accent)}
.card ul.flist li span{color:var(--muted)}
.card.folded ul.flist{display:none}
.card.mod.opens .nm::after{content:" ›";color:var(--muted)}
path.wire.breach{stroke-width:2}
/* The map's other cards. A feature is a pill in its system's colour; a page
   wears a browser's bar; a component is drawn dashed, being a piece of one;
   the design system is a swatch; a store is a drum with its shape listed;
   a trigger is a small tab with a mark for a clock, an event or a command. */
.card.feat{border:1px solid color-mix(in srgb,var(--gc) 60%,var(--hair));border-radius:18px;
  background:color-mix(in srgb,var(--gc) 10%,var(--surface));padding:8px 12px}
.card.feat .nm{font-family:var(--font-ui);font-weight:700;color:color-mix(in srgb,var(--gc) 70%,var(--ink))}
.card.page{border-top:7px solid color-mix(in srgb,var(--gc) 45%,var(--hair));border-radius:7px}
.card.page.start{border-top-color:var(--accent)}
.card.page .nm::before{content:"\25AD  ";color:var(--muted)}
.card.page.start .nm::after{content:"  start";font-size:9px;color:var(--accent);font-weight:700}
.card.comp{border:1px dashed color-mix(in srgb,var(--gc) 70%,var(--hair));border-radius:7px}
.card.comp .nm::before{content:"\25C7  ";color:var(--muted)}
.card.design{border:1px solid var(--hair);border-radius:7px;
  background:linear-gradient(90deg,hsl(10 70% 60%/.25),hsl(130 60% 55%/.25),hsl(220 70% 60%/.25)) top/100% 5px no-repeat,var(--surface)}
.card.store{border:1px solid var(--hair);border-radius:50% 50% 8px 8px/14px 14px 8px 8px;
  padding-top:12px;background:var(--surface-2)}
.card.trig{border:1px solid var(--hair);border-left:4px solid hsl(45 80% 50%);border-radius:5px}
.card.trig .nm::before{content:"\23F1  ";color:var(--muted)}
.card.trig.event .nm::before{content:"\26A1  "}
.card.trig.command .nm::before{content:"$  "}
.card.loose{border:1px dashed var(--breach)}
.card.loose .nm{color:var(--breach)}
.card ul.fields{list-style:none;margin:6px 0 0;padding:5px 0 0;border-top:1px solid var(--hair-soft)}
.card ul.fields li{font-family:var(--font-mono);font-size:10px;padding:0 2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.card ul.fields li.none{color:var(--breach)}
#tabs{display:flex;gap:2px}
#tabs button{font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:5px;
  background:none;border:1px solid transparent;color:var(--muted)}
#tabs button[aria-pressed="true"]{border-color:var(--hair);background:var(--surface);color:var(--ink)}
#issues{cursor:pointer;background:none;border:0;padding:0}
#issues:hover{text-decoration:underline}
#panel .why{font-size:10px;color:var(--breach);padding:1px 6px 2px 19px;line-height:1.45}
#panel ol.found{margin:0;padding:0 0 0 16px;font-family:var(--font-mono);font-size:10px;line-height:1.5}
#panel ol.found li{margin-bottom:4px;word-break:break-word}
/* a served page talks back: the mismatches list grows buttons, and cards with
   a mismatch carry a red dot */
#panel.listing{width:340px}
#panel .phead{display:flex;align-items:center;gap:6px}
#panel .phead .close{position:static}
#panel ol.found.acting{list-style:none;padding:0}
#panel ol.found.acting li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;
  border-top:1px solid var(--hair);margin:0}
#panel .ftext{flex:1 1 auto;min-width:0;font-family:var(--font-ui);font-size:11.5px;line-height:1.4}
#panel .where{display:block;font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px}
#panel .fbtn{display:flex;gap:4px;flex:0 0 auto}
#panel .fbtn button,#panel .phead button{white-space:nowrap}
#panel li .fbtn button{width:auto;flex:0 0 auto;font-family:inherit;font-size:11px;padding:2px 8px}
#panel .grp{display:flex;align-items:center;gap:6px;margin:12px 0 4px}
#panel .grp .fold{border:0;background:none;padding:2px 0;font-weight:700;font-size:11px;text-align:left;flex:1 1 auto}
#panel .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
button.act{background:var(--accent);color:var(--on-accent);border-color:transparent}
button.act:hover{filter:brightness(1.08);border-color:transparent}
button.sm{font-size:11px;padding:2px 8px}
.card.flagged::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;
  border-radius:50%;background:var(--breach);box-shadow:0 0 0 2px var(--surface)}
#make{display:flex;gap:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:var(--surface);padding:8px 14px;border-radius:8px;font-size:12px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
#panel .names{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);
  padding:1px 6px 2px 19px;line-height:1.45;word-break:break-word}
#panel .names b{color:var(--breach);font-weight:600}
#panel .chips{display:flex;flex-wrap:wrap;gap:4px}
#panel .chips span{font-family:var(--font-mono);font-size:10px;padding:1px 6px;
  border:1px solid var(--hair);border-radius:4px;background:var(--surface-2)}
#panel .note{font-size:11px;color:var(--muted);line-height:1.5}
#panel .open{display:block;width:100%;margin-top:10px;background:var(--accent);
  border-color:var(--accent);color:var(--on-accent)}

@media (max-width:860px){
  #panel{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    width:auto;top:auto;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 40px);max-height:52%}
  #legend{display:none}
  input[type=search]{width:96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="shell">
  <header>
    <h1>codegraph</h1>
    <nav id="tabs" aria-label="Views"></nav>
    <nav id="crumbs" aria-label="Where you are in the codebase"></nav>
    <span class="counts" id="counts"></span>
    <button class="counts issues" id="issues" hidden></button>
    <span class="spacer"></span>
    <div class="toolbar">
      <span id="make" hidden></span>
      <input type="search" id="q" placeholder="find a card" aria-label="Find a card">
    </div>
  </header>
  <div id="stage">
    <div id="canvas"><svg id="wires"></svg></div>
    <aside id="panel"></aside>
    <div id="marquee" hidden></div>
    <div id="corner">
      <button id="b-wires" aria-pressed="false"
        title="Show every wire, or only the ones on the card you point at or pick">All wires</button>
      <button id="b-fit">Fit</button>
      <button id="b-reset">Reset layout</button>
    </div>
    <div id="legend">
      <button id="legend-toggle" aria-expanded="true" aria-controls="legend-body">
        <span>Legend</span><span class="chev" aria-hidden="true">▾</span></button>
      <div id="legend-body">
        <div id="legend-rows"></div>
        <div class="key" id="folder-key"></div>
        <div class="gen">drag a card &middot; drag the background to pan &middot; scroll to zoom
          &middot; shift-drag to pick several</div>
        <div class="gen" id="gen"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
var GRAPH = /*__GRAPH__*/null;
/* set when the page is served live: where to send what the person asks */
var LIVE = /*__LIVE__*/null;

(function(){
"use strict";
if(!GRAPH){document.getElementById("panel").textContent="No graph data.";return;}

var CW=170, CH=62, COLGAP=112, HEADY=26, TIERGAP=96, SYSGAP=44, X0=24;

/* ------------------------------------------------------------------- views
   The file graph is always one view. The tags (or a draft of them) add the
   map, the page map, and one view inside each card. The generator places
   every card in every view; the page only draws whichever is open. */
var MODS=GRAPH.map||null;

/* ------------------------------------------------------------- open a view */
var cur=null, trail=[], V=null, nodes={}, order=[], edges=[], out={}, inn={},
    base={}, colX={}, pos={}, cardEls={}, wireEls={}, threadEls={}, rowY={}, frame=null,
    frames=[];

/* a box around the cards it holds, wherever they have been dragged; a box
   holding boxes stands further out, to clear their names */
function box(el,holds,outer){
  var x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity, PAD=outer?28:16, HEAD=outer?36:18;
  order.forEach(function(n){
    if(!holds(n)) return;
    x0=Math.min(x0,pos[n.id].x); y0=Math.min(y0,pos[n.id].y);
    x1=Math.max(x1,pos[n.id].x+cw(n.id)); y1=Math.max(y1,pos[n.id].y+hgt[n.id]);
  });
  el.style.left=(x0-PAD)+"px"; el.style.top=(y0-PAD-HEAD)+"px";
  el.style.width=(x1-x0+2*PAD)+"px"; el.style.height=(y1-y0+2*PAD+HEAD)+"px";
}
function drawFrame(){
  if(frame) box(frame,function(n){ return n.own; });
  frames.forEach(function(f){
    box(f.el,function(n){ return f.within?n.group===f.id:n.block===f.id; },
        frames.some(function(g){ return g.within===f.id; }));
  });
}
/* how wide a card draws: as big as the code it holds */
var wid={};
function cw(id){ return wid[id]||CW; }

/* where each file sits in a card's list, measured while the list is drawn */
function measureRows(id){
  rowY[id]={};
  Array.prototype.forEach.call(cardEls[id].querySelectorAll("[data-file]"),function(li){
    rowY[id][li.getAttribute("data-file")]=li.offsetTop+li.offsetHeight/2;
  });
}

/* only the cards someone dragged keep a place of their own; the rest follow
   the layout, so a card growing or folding moves its neighbours */
var hgt={}, moved={}, GAP=16;
var folded=load("folded")||{};
function posKey(){ return "at:"+cur; }

/* the room between two cards stacked in a column: more between two systems,
   for the second one's box and name */
function gapAfter(a,b){ return V.blocks&&a.block==="features"&&a.group!==b.group?GAP+SYSGAP:GAP; }
function stack(list){
  return list.reduce(function(s,n,i){ return s+hgt[n.id]+(i?gapAfter(list[i-1],n):0); },0);
}

/* slide each card in a column level with the cards it is wired to, keeping
   the column's order and gaps and staying between lo and hi; a few sweeps
   back and forth settle it */
function relax(cols,keys,lo,hi){
  var centre=function(id){ return base[id].y+hgt[id]/2; };
  for(var sweep=0;sweep<6;sweep++){
    (sweep%2?keys.slice().reverse():keys).forEach(function(k){
      var list=cols[k], ys=list.map(function(n){
        var near=out[n.id].map(function(e){ return e.to; }).concat(inn[n.id].map(function(e){ return e.from; }))
          .filter(function(o){ return base[o]&&base[o].x!==base[n.id].x; });
        return near.length?near.reduce(function(s,o){ return s+centre(o); },0)/near.length-hgt[n.id]/2
                          :base[n.id].y;
      });
      for(var i=list.length-1;i>=0;i--){          // from the foot up, no lower than hi
        var floor=i===list.length-1?hi:ys[i+1]-gapAfter(list[i],list[i+1]);
        ys[i]=Math.min(ys[i],floor-hgt[list[i].id]);
      }
      for(i=0;i<list.length;i++){                 // from the head down, no higher than lo
        ys[i]=Math.max(ys[i],i?ys[i-1]+hgt[list[i-1].id]+gapAfter(list[i-1],list[i]):lo);
        base[list[i].id].y=ys[i];
      }
    });
  }
}

/* turn the generator's columns and rows into pixels: each column as wide as
   its biggest card and stacked by the cards' real heights. The map comes in
   tiers, each column in a tier stacked from the top, or from the bottom
   above the middle tier so those cards sit on the block below them; below
   it, they start just under the block they hang from. Any other view is one
   tier, its columns centred against the tallest. Then the middle tier's
   cards slide level with what they are wired to. */
function layout(){
  var cols={}, total={}, tall={}, top={}, tiers=[], colW=[], blocks=!!V.blocks;
  base={}; colX={};
  order.forEach(function(n){
    var k=(n.tier===undefined?1:n.tier)+"|"+n.col;
    (cols[k]=cols[k]||[]).push(n);
    colW[n.col]=Math.max(colW[n.col]||0,cw(n.id));
  });
  for(var c=0,x=blocks?X0:0;c<colW.length;c++){ colX[c]=x; x+=(colW[c]||CW)+COLGAP; }
  Object.keys(cols).forEach(function(k){
    var t=Number(k.split("|")[0]);
    cols[k].sort(function(a,b){ return a.row-b.row; });
    total[k]=stack(cols[k]);
    if(tall[t]===undefined) tiers.push(t);
    tall[t]=Math.max(tall[t]||0,total[k]);
  });
  var y0=blocks?2*HEADY:HEADY;
  tiers.sort(function(a,b){ return a-b; }).forEach(function(t){ top[t]=y0; y0+=tall[t]+TIERGAP; });
  function place(k,y){
    var c=Number(k.split("|")[1]);
    cols[k].forEach(function(n,i){
      if(i) y+=gapAfter(cols[k][i-1],n);
      base[n.id]={x:colX[c]+((colW[c]||CW)-cw(n.id))/2,y:y};
      y+=hgt[n.id];
    });
  }
  var keys=Object.keys(cols), mid=keys.filter(function(k){ return k.split("|")[0]==="1"; });
  keys.forEach(function(k){
    var t=Number(k.split("|")[0]), spare=tall[t]-total[k];
    if(t<=1) place(k,!blocks?top[t]+spare/2:t<1?top[t]+spare:top[t]);
  });
  relax(cols,mid,top[1],top[1]+tall[1]);
  keys.forEach(function(k){                // below: just under the block it hangs from
    if(k.split("|")[0]<=1) return;
    var c=k.split("|")[1], foot=0;
    (cols["1|"+c]||[]).forEach(function(n){ foot=Math.max(foot,base[n.id].y+hgt[n.id]); });
    place(k,foot?foot+TIERGAP:top[Number(k.split("|")[0])]);
  });
  pos={};
  order.forEach(function(n){
    var m=moved[n.id];
    pos[n.id]=m&&typeof m.x==="number"?{x:m.x,y:m.y}:{x:base[n.id].x,y:base[n.id].y};
  });
}

/* a module card lists its files, folded or not; the choice is per module and
   kept in this browser */
function fileList(el,hd,n){
  var fold=document.createElement("button");
  fold.className="fold"; fold.setAttribute("aria-label","Show or hide the files");
  fold.setAttribute("aria-expanded",String(!folded[n.id]));
  fold.textContent="▾";
  hd.appendChild(fold);
  var seen={};
  n.files.forEach(function(fid){ var f=FILES[fid]; if(f) seen[f.label]=(seen[f.label]||0)+1; });
  var ul=document.createElement("ul"); ul.className="flist";
  n.files.forEach(function(fid){
    var f=FILES[fid]||{label:fid,dir:""}, li=document.createElement("li");
    li.setAttribute("data-file",fid); li.title=fid;
    if(seen[f.label]>1){
      var s=document.createElement("span"); s.textContent=f.dir.split("/").pop()+"/";
      li.appendChild(s);
    }
    li.appendChild(document.createTextNode(f.label));
    ul.appendChild(li);
  });

}
/* a store's shape, or what an event carries, read from its schema */
function fieldList(el,n){
  var ul=document.createElement("ul"); ul.className="fields";
  var rows=n.fields.length?n.fields:(n.kind==="store"?["no schema read"]:[]);
  rows.forEach(function(f){
    var li=document.createElement("li"); li.textContent=f; li.title=f;
    if(!n.fields.length) li.className="none";
    ul.appendChild(li);
  });
  if(rows.length) el.appendChild(ul);
}
/* Folding eases the card's height from one size to the other while the list
   inside is clipped. Every frame the columns re-stack and the wires redraw,
   so the neighbours and the wires travel with the card instead of jumping. */
var FOLD_MS=matchMedia("(prefers-reduced-motion: reduce)").matches?0:240, folding={};
function toggleFold(id){
  folded[id]=!folded[id]; save("folded",folded);
  var el=cardEls[id], b=el.querySelector(".fold");
  b.setAttribute("aria-expanded",String(!folded[id]));
  if(folding[id]) cancelAnimationFrame(folding[id]);

  var from=el.offsetHeight;                 // where it is now, even mid-fold
  var o0=openness[id]===undefined?(folded[id]?1:0):openness[id], o1=folded[id]?0:1;
  el.style.height=""; el.classList.toggle("folded",!!folded[id]);
  var to=el.offsetHeight;
  el.classList.remove("folded");            // keep the list drawn while it clips
  measureRows(id);
  el.style.overflow="hidden"; el.style.height=from+"px";

  var start=performance.now();
  function step(now){
    var t=FOLD_MS?Math.min(1,(now-start)/FOLD_MS):1;
    var k=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;      // ease in and out
    hgt[id]=from+(to-from)*k;
    openness[id]=o0+(o1-o0)*k;
    el.style.height=hgt[id]+"px";
    layout(); render();
    if(t<1){ folding[id]=requestAnimationFrame(step); return; }
    folding[id]=0;
    el.style.height=""; el.style.overflow="";
    el.classList.toggle("folded",!!folded[id]);
    hgt[id]=el.offsetHeight; layout(); render();
  }
  folding[id]=requestAnimationFrame(step);
}

function show(key){
  V=VIEWS[key]; cur=key; selected=null; hovered=null; query=""; qbox.value=""; picked={};
  shownWires={};
  nodes={}; order=V.nodes.slice();
  order.forEach(function(n){ nodes[n.id]=n; });
  edges=V.edges.filter(function(e){ return nodes[e.from]&&nodes[e.to]; })
    .map(function(e,i){ return {i:i,from:e.from,to:e.to,kind:e.kind,
                                names:e.names||[],why:e.why||[],via:e.via||[],
                                bad:(e.bad||[]).concat((e.why||[]).length&&!(e.bad||[]).length?["rule"]:[])}; });
  out={}; inn={};
  order.forEach(function(n){ out[n.id]=[]; inn[n.id]=[]; });
  edges.forEach(function(e){ out[e.from].push(e); inn[e.to].push(e); });

  Array.prototype.slice.call(canvas.children).forEach(function(c){
    if(c!==svg) canvas.removeChild(c);
  });
  while(gWires.firstChild) gWires.removeChild(gWires.firstChild);

  /* inside a module, a thin box around its own files: anything outside the
     box is another module or an outside connection */
  frame=null;
  if(order.some(function(n){ return n.own; })){
    frame=document.createElement("div");
    frame.className="frame";
    frame.style.setProperty("--gc",gcolor(V.group||cur));
    var tag=document.createElement("span"); tag.textContent=V.title;
    frame.appendChild(tag);
    canvas.insertBefore(frame,svg);          // behind the wires too
  }
  /* on the map, a box around each block: modules, features, pages and
     what sits above and below them; inside features, one round each system */
  frames=(V.blocks||[]).map(function(b){
    var el=document.createElement("div");
    el.className="frame";
    el.style.setProperty("--gc",b.within?gcolor(b.id):"var(--muted)");
    var tag=document.createElement("span"); tag.textContent=b.label;
    el.appendChild(tag);
    canvas.insertBefore(el,svg);
    return {id:b.id, el:el, within:b.within};
  });

  cardEls={}; hgt={}; wid={};
  order.forEach(function(n){
    var el=document.createElement("div");
    // a card as big as the code it holds, beside the others in this view
    wid[n.id]=Math.round(CW*(n.size||1));
    el.style.width=wid[n.id]+"px"; el.style.minHeight=Math.round(CH*(n.size||1))+"px";
    el.style.setProperty("--s",n.size||1);
    el.className="card "+(CARDCLASS[n.kind]||"ext")+(n.start?" start":"")+
      (n.kind==="trigger"&&n.dir!=="schedule"?" "+n.dir:"")+
      (VIEWS[n.id]&&n.id!==cur?" opens":"")+(folded[n.id]?" folded":"")+(FLAG[n.id]?" flagged":"");
    el.style.setProperty("--gc",gcolor(n.group));
    el.tabIndex=0; el.setAttribute("role","button");
    var hd=document.createElement("div"); hd.className="hd";
    var nm=document.createElement("div"); nm.className="nm"; nm.textContent=n.label;
    hd.appendChild(nm);
    var dir=document.createElement("div"); dir.className="dir"; dir.textContent=n.dir;
    var foot=document.createElement("div"); foot.className="foot";
    foot.textContent=(n.lines?n.lines+" lines  ":"")+"↱"+inn[n.id].length+" ↳"+out[n.id].length;
    if(n.kind==="module"){
      // a module's name and counts sit together in its coloured band
      var band=document.createElement("div"); band.className="band";
      band.appendChild(hd); band.appendChild(dir); band.appendChild(foot);
      el.appendChild(band);
    } else { el.appendChild(hd); el.appendChild(dir); el.appendChild(foot); }
    if(n.files&&n.files.length) fileList(el,hd,n);
    if(n.kind==="store"||n.kind==="trigger") fieldList(el,n);
    canvas.appendChild(el); cardEls[n.id]=el;
    hgt[n.id]=el.offsetHeight;
    if(n.files&&!folded[n.id]) measureRows(n.id);
    openness[n.id]=folded[n.id]?0:1;
    drag(el,n);
  });

  moved=load(posKey())||{};
  layout();

  (V.columns||[]).forEach(function(c,i){
    if(!c.label||colX[i]===undefined) return;
    var d=document.createElement("div");
    d.className="colhead"; d.textContent=c.label;
    d.style.setProperty("--gc","var(--muted)");
    d.style.left=colX[i]+"px"; d.style.top="0px"; d.style.width=CW+"px";
    canvas.appendChild(d);
  });

  wireEls={}; threadEls={};
  edges.forEach(function(e){
    var d=KINDS[e.kind]||KINDS["import"], bad=e.bad.length>0;
    function strand(){
      var p=document.createElementNS(NS,"path");
      p.setAttribute("class","wire"+(bad?" breach":""));
      p.setAttribute("stroke",bad?"var(--breach)":kcolor(e.kind));
      p.setAttribute("stroke-width",String(d.width));
      if(d.dash) p.setAttribute("stroke-dasharray",d.dash);
      p.setAttribute("opacity",bad?"0.95":isWiring(e.kind)?"0.6":"0.9");
      p.addEventListener("transitionend",landed);
      gWires.appendChild(p);
      return p;
    }
    e.head="url(#ar-"+(bad?"breach":e.kind)+")";
    e.at=headOf(e.kind);
    wireEls[e.i]=strand();
    // one thread per file on the importing card that pulls this wire in
    if(nodes[e.from].files) threadEls[e.i]=e.via.map(function(fid){
      return {fid:fid, el:strand()};
    });
  });

  drawKey(); drawCrumbs(); drawTabs(); save("trail",trail);
  render(); drawPanel(); openView();
}

/* from the top: the map, then the card you went into. Pages and Files
   stand alone. */
function open(key){
  if(!VIEWS[key]) return;
  trail = TOP.indexOf(key)>=0 ? [key] : ["map",key];
  show(key);
}
function drawTabs(){
  var tabs=document.getElementById("tabs");
  tabs.innerHTML="";
  if(!MODS) return;
  TOP.forEach(function(k){
    var b=document.createElement("button"); b.textContent=VIEWS[k].title;
    b.setAttribute("aria-pressed",String(trail[0]===k));
    b.addEventListener("click",function(){ open(k); });
    tabs.appendChild(b);
  });
}

function drawKey(){
  var key=document.getElementById("folder-key"), seen={};
  key.innerHTML="";
  order.forEach(function(n){ seen[n.group]=(seen[n.group]||0)+1; });
  V.groups.forEach(function(g){
    if(!seen[g]||g==="(outside)"||g==="(external)") return;
    var s=document.createElement("span");
    s.innerHTML='<i style="background:'+gcolor(g)+'"></i><b>'+esc(g)+'</b>';
    s.title=g+" · "+seen[g]+" cards";
    key.appendChild(s);
  });
}

/* where you are, from the codebase down: every step but the last goes back
   up to it */
function drawCrumbs(){
  crumbs.innerHTML="";
  var steps=[{key:trail[0],label:GRAPH.root||"codebase"}];
  trail.slice(1).forEach(function(k){ steps.push({key:k,label:VIEWS[k].title}); });
  steps.forEach(function(s,i){
    if(i) crumbs.appendChild(document.createTextNode(" › "));
    if(i===steps.length-1){
      var here=document.createElement("b"); here.textContent=s.label;
      here.setAttribute("aria-current","location");
      crumbs.appendChild(here);
    } else {
      var up=document.createElement("button"); up.textContent=s.label;
      up.addEventListener("click",function(){ open(s.key); });
      crumbs.appendChild(up);
    }
  });
}

/* ------------------------------------------------------------------ render */
/* Each wire gets its own point on the side of a card, not one shared centre,
   so a pair running both ways reads as two wires. A side's wires are spread
   in order of how high the card at the other end sits, which keeps them from
   crossing as they leave. They spread over the card's head, not down a file
   list that would suggest a wire belongs to one file. */
var ports={};
function placePorts(vis){
  var sides={};
  function add(id,side,e,end,other){
    (sides[id+"|"+side]=sides[id+"|"+side]||{id:id,side:side,list:[]})
      .list.push({e:e,end:end,other:other});
  }
  ports={};
  vis.forEach(function(e){
    var a=pos[e.from], b=pos[e.to];
    if(Math.abs(a.x+cw(e.from)/2-b.x-cw(e.to)/2)<Math.min(cw(e.from),cw(e.to))/2){
      // one above the other: straight down when nothing sits between them,
      // else out to the right and back, clear of the cards in between
      var lo=Math.min(a.y,b.y), hi=Math.max(a.y,b.y), down=b.y>a.y;
      var between=order.some(function(n){
        var p=pos[n.id];
        return Math.abs(p.x+cw(n.id)/2-a.x-cw(e.from)/2)<cw(n.id)/2&&p.y>lo&&p.y<hi;
      });
      add(e.from,between?"r":down?"b":"t",e,0,e.to);
      add(e.to,between?"r":down?"t":"b",e,1,e.from);
      return;
    }
    var fwd=b.x>=a.x;
    // every wire keeps its place on the side, open or folded, so folding a
    // card moves only the wires that go to its rows
    add(e.from,fwd?"r":"l",e,0,e.to);
    add(e.to,fwd?"l":"r",e,1,e.from);
  });
  Object.keys(sides).forEach(function(k){
    var s=sides[k], top=pos[s.id].y, flat=s.side==="t"||s.side==="b";
    var span=Math.min(hgt[s.id],Math.max(CH,12*(s.list.length+1)));
    s.list.sort(function(a,b){
      var ay=pos[a.other].y+Math.min(hgt[a.other],CH)/2,
          by=pos[b.other].y+Math.min(hgt[b.other],CH)/2;
      return (flat?0:ay-by)||pos[a.other].x-pos[b.other].x||a.e.i-b.e.i;
    });
    s.list.forEach(function(p,i){
      var at=(i+1)/(s.list.length+1);
      (ports[p.e.i]=ports[p.e.i]||[])[p.end]=flat?{
        x:pos[s.id].x+cw(s.id)*at, y:s.side==="b"?top+hgt[s.id]:top,
        d:0, v:s.side==="b"?1:-1}:{
        x:s.side==="r"?pos[s.id].x+cw(s.id):pos[s.id].x, y:top+span*at,
        d:s.side==="r"?1:-1, v:0};
    });
  });
}
function curve(s,t){
  var far=s.v||t.v?Math.abs(t.y-s.y):Math.abs(t.x-s.x);
  var bend=Math.max(34,Math.min(150,far*0.46));
  return "M"+s.x+" "+s.y+" C"+(s.x+s.d*bend)+" "+(s.y+s.v*bend)+" "+
    (t.x+t.d*bend)+" "+(t.y+t.v*bend)+" "+t.x+" "+t.y;
}

/* With a card's file list open, a wire lands on the files that pull it in.
   One file: the wire runs straight to its row. Several: one trunk to a split
   just outside the card, then a thread to each row. Folded, it is one wire to
   the card's side again. */
var SPLIT=30;
/* how open each card's list is, 0 to 1; it eases with the fold, and every
   arrow on that card slides between its place on the side and its row */
var openness={};
function threaded(e){
  return !!(threadEls[e.i]&&threadEls[e.i].length&&openness[e.from]>0&&rowY[e.from]);
}
function lerp(a,b,k){ return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k, d:b.d, v:b.v}; }
function drawWire(e,show){
  var main=wireEls[e.i], threads=threadEls[e.i]||[];
  threads.forEach(function(t){ t.el.style.display="none"; });
  main.style.display=show?"":"none";
  if(!show) return [];
  var side=ports[e.i][0], t=ports[e.i][1];
  var atFrom=e.at!=="to", atTo=e.at!=="from";
  if(atTo) main.setAttribute("marker-end",e.head); else main.removeAttribute("marker-end");
  if(!threaded(e)||!side.d){                  // off the top or bottom, it lands on the card
    if(atFrom) main.setAttribute("marker-start",e.head); else main.removeAttribute("marker-start");
    main.setAttribute("d",curve(side,t));
    return [main];
  }
  var c=e.from, o=openness[c], d=side.d, x=side.x, sum=0;
  var rows=threads.map(function(th){
    var y=rowY[c][th.fid];
    y=pos[c].y+(y===undefined?Math.min(hgt[c],CH)/2:Math.min(y,hgt[c]-6));
    var at=lerp(side,{x:x,y:y,d:d,v:0},o);
    sum+=at.y; return {th:th, at:at};
  });
  if(rows.length===1){
    if(atFrom) main.setAttribute("marker-start",e.head); else main.removeAttribute("marker-start");
    main.setAttribute("d",curve(rows[0].at,t));
    return [main];
  }
  // the split starts on the side and steps out as the list opens
  var j=lerp(side,{x:x+d*SPLIT, y:sum/rows.length, d:d, v:0},o);
  main.removeAttribute("marker-start");
  main.setAttribute("d",curve(j,t));
  rows.forEach(function(r){
    var s=r.at, h=SPLIT*0.55;
    r.th.el.style.display="";
    if(atFrom) r.th.el.setAttribute("marker-start",e.head); else r.th.el.removeAttribute("marker-start");
    r.th.el.setAttribute("d","M"+s.x+" "+s.y+" C"+(s.x+d*h)+" "+s.y+" "+(j.x-d*h)+" "+j.y+" "+j.x+" "+j.y);
  });
  return [main].concat(rows.map(function(r){ return r.th.el; }));
}
/* which wires are lit: those on the card you point at, the one you picked,
   and any you shift-picked. A red wire always shows: a broken rule is not
   something to go looking for. */
function litSet(){
  var s={};
  [selected,hovered].concat(pickedIds()).forEach(function(id){
    if(!id||!out[id]) return;
    out[id].forEach(function(e){ s[e.i]=true; });
    inn[id].forEach(function(e){ s[e.i]=true; });
  });
  return s;
}
var STILL=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
/* A wire appears by drawing itself from one card to the other: it hides behind
   a gap as long as itself, and the gap slides off the end. The kind's own dash
   pattern comes back when it lands. */
function drawOn(p){
  if(STILL) return;
  var len=p.getTotalLength();
  if(!len) return;
  p.classList.add("drawing");
  p.style.transition="none";
  p.style.strokeDasharray=len+" "+len;
  p.style.strokeDashoffset=len;
  p.getBoundingClientRect();           // the browser takes that as the start
  p.style.transition="stroke-dashoffset .42s cubic-bezier(.33,0,.2,1)";
  p.style.strokeDashoffset="0";
}
function plain(p){
  if(!p.style.strokeDasharray) return;
  p.classList.remove("drawing");
  p.style.transition=""; p.style.strokeDasharray=""; p.style.strokeDashoffset="";
}
function landed(ev){
  if(ev.propertyName==="stroke-dashoffset") plain(ev.target);
}
/* which wires are on screen, so one that has just arrived draws itself and the
   rest stay put. Pointing at a card runs this alone: nothing else moves. */
var shownWires={};
function lightWires(){
  var lit=focusWires?litSet():null;
  edges.forEach(function(e){
    var on=!lit||!!lit[e.i]||e.bad.length>0;
    var strands=drawWire(e,on);
    var hot=!!selected&&(e.from===selected||e.to===selected);
    var fresh=on&&!shownWires[e.i];
    strands.forEach(function(p){
      p.classList.toggle("hot",hot);
      p.classList.toggle("dim",!lit&&!!selected&&!hot);
      if(fresh&&lit) drawOn(p); else if(fresh) plain(p);
    });
    shownWires[e.i]=on;
  });
}
function near(id){
  var set={}; set[id]=true;
  out[id].forEach(function(e){ set[e.to]=true; });
  inn[id].forEach(function(e){ set[e.from]=true; });
  return set;
}
function extent(){
  var w=0,h=0;
  order.forEach(function(n){ w=Math.max(w,pos[n.id].x+cw(n.id)); h=Math.max(h,pos[n.id].y+hgt[n.id]); });
  return {w:w,h:h};
}
function hits(n){
  return n.id.toLowerCase().indexOf(query)>=0||String(n.label).toLowerCase().indexOf(query)>=0;
}

function render(){
  var ring=selected?near(selected):null;
  var ev=0, bad=0;
  placePorts(edges);
  drawFrame();
  order.forEach(function(n){
    var el=cardEls[n.id];
    el.style.transform="translate("+pos[n.id].x+"px,"+pos[n.id].y+"px)";
    el.classList.toggle("sel",selected===n.id);
    el.classList.toggle("near",!!ring&&ring[n.id]&&selected!==n.id);
    el.classList.toggle("dim",!!ring&&!ring[n.id]);
    el.classList.toggle("hit",!!query&&!selected&&hits(n));
    el.classList.toggle("picked",!!picked[n.id]);
  });
  lightWires();
  ev=edges.length;
  edges.forEach(function(e){ if(e.bad.length) bad++; });
  var b=extent();
  svg.setAttribute("width",b.w+40); svg.setAttribute("height",b.h+40);
  canvas.style.width=(b.w+40)+"px"; canvas.style.height=(b.h+40)+"px";
  applyView();
  var unit=V.unit==="units"?"cards":V.unit;
  counts.textContent=order.length+" "+unit+" · "+ev+" wires"+
    (cur==="files"?" · "+GRAPH.groups.length+" folders":
     MODS&&MODS.source==="draft"?" · drafted, nothing tagged yet":"");
  var found=MODS?MODS.mismatches.length:0;
  issues.hidden=!found;
  issues.textContent=found+(found===1?" mismatch":" mismatches")+(bad?" · "+bad+" red wires":"");
}
/* panning and zooming only move the canvas, so they skip redrawing the wires;
   the dot grid moves with it so the background reads as the same surface.
   While it moves the canvas is one cached picture, which keeps motion smooth
   but stretches it soft; once it settles the browser redraws it sharp. */
var settle=0;
function applyView(){
  canvas.classList.add("moving");
  clearTimeout(settle);
  settle=setTimeout(function(){ canvas.classList.remove("moving"); },160);
  canvas.style.transform="translate("+panX+"px,"+panY+"px) scale("+scale+")";
  var g=24*scale;
  stage.style.backgroundSize=g+"px "+g+"px";
  stage.style.backgroundPosition=panX+"px "+panY+"px";
}

/* --------------------------------------------------------------- inspector */
var listing=false;
var shutGroups=load("shutGroups")||{}, listFolded=!!load("listFolded");
function drawFindings(){
  var all=ISSUES;
  var h='<div class="phead"><h2>Mismatches ('+all.length+')</h2><span class="spacer"></span>';
  if(LIVE&&all.length) h+='<button class="act sm" id="fix-all">'+(all.length===1?"Fix it":"Fix all "+all.length)+'</button>';
  h+='<button class="sm" id="p-fold" aria-label="'+(listFolded?"Show the list":"Fold the list away")+'">'+
     (listFolded?"Show":"Fold")+'</button>';
  h+='<button class="close" id="p-close" aria-label="Close">\u00d7</button></div>';
  if(!listFolded){
    h+='<p class="note">Where the code breaks a rule or disagrees with its tags, worst first.'+
       (LIVE?' <b>Fix</b> puts the fix in the chat box; <b>Show</b> finds it on the map.':'')+'</p>';
    GROUPS.forEach(function(g){
      var list=all.filter(function(i){ return i.group===g.id; });
      if(!list.length) return;
      var shut=!!shutGroups[g.id];
      h+='<div class="grp"><button class="fold" data-fold="'+esc(g.id)+'">'+(shut?"\u25b8":"\u25be")+' '+
         esc(g.label)+' \u00b7 '+list.length+'</button>';
      if(LIVE&&list.length>1&&!shut) h+='<button class="act sm" data-fixgroup="'+esc(g.id)+'">Fix these</button>';
      h+='</div>';
      if(shut) return;
      h+='<ol class="found acting">'+list.map(function(i){
        var k=all.indexOf(i);
        return '<li><div class="ftext">'+esc(i.text)+'<span class="where">'+esc(i.rel+(i.line?":"+i.line:""))+
          '</span></div><div class="fbtn">'+(i.card?'<button class="sm" data-show="'+k+'">Show</button>':'')+
          (LIVE?'<button class="act sm" data-fix="'+k+'">Fix</button>':'')+'</div></li>';
      }).join("")+'</ol>';
    });
    if(MODS.unknown.length){
      h+='<h3>Cannot tell ('+MODS.unknown.length+')</h3>';
      h+='<ol class="found">'+MODS.unknown.map(function(m){ return '<li>'+esc(m)+'</li>'; }).join("")+'</ol>';
    }
  }
  panel.innerHTML=h; panel.hidden=false; panel.classList.add("listing");
  function on(sel,fn){ Array.prototype.forEach.call(panel.querySelectorAll(sel),function(b){
    b.addEventListener("click",function(){ fn(b); }); }); }
  on("#p-close",function(){ listing=false; panel.hidden=true; panel.classList.remove("listing"); });
  on("#p-fold",function(){ listFolded=!listFolded; save("listFolded",listFolded); drawFindings(); });
  on("#fix-all",function(){ send(fixMany(all,"mismatches")); });
  on("[data-fold]",function(b){ var g=b.getAttribute("data-fold");
    shutGroups[g]=!shutGroups[g]; save("shutGroups",shutGroups); drawFindings(); });
  on("[data-fixgroup]",function(b){ var g=b.getAttribute("data-fixgroup");
    var label=(GROUPS.filter(function(x){ return x.id===g; })[0]||{}).label||g;
    send(fixMany(all.filter(function(i){ return i.group===g; }),'"'+label+'" mismatches')); });
  on("[data-fix]",function(b){ send(fixOne(all[+b.getAttribute("data-fix")])); });
  on("[data-show]",function(b){ showIssue(all[+b.getAttribute("data-show")]); });
}
/* find a mismatch where it lives: its card on the map, picked and centred */
function showIssue(i){
  if(cur!=="map"&&VIEWS.map) open("map");
  var id=nodes[i.card]?i.card:nodes[i.file]?i.file:null;
  if(id){ listing=false; select(id); focus(id); }
}
issues.addEventListener("click",function(){ listing=true; selected=null; render(); drawFindings(); });
function drawPanel(){
  if(listing&&!selected){ drawFindings(); return; }
  listing=false; panel.classList.remove("listing");
  panel.hidden=!selected;
  if(!selected) return;
  var n=nodes[selected], c=gcolor(n.group);
  var h='<button class="close" id="p-close" aria-label="Clear selection">×</button>';
  h+='<h2 style="--gc:'+c+'">'+esc(n.label)+'</h2>';
  h+='<div class="ppath">'+esc(n.kind==="file"?n.id:n.kind==="design"?"design system":n.kind)+'</div>';
  h+='<div class="meta"><span>'+esc(n.dir)+'</span>';
  if(n.lines) h+='<span>'+n.lines+' lines</span>';
  h+='<span>'+inn[n.id].length+' in</span><span>'+out[n.id].length+' out</span></div>';
  if(VIEWS[n.id]&&n.id!==cur)
    h+='<button class="open" data-open="'+esc(n.id)+'">Open '+esc(n.label)+' ›</button>';
  var mine=ISSUES.filter(function(i){ return i.card===n.id||i.file===n.id; });
  if(mine.length) h+='<p class="note" style="color:var(--breach)">'+mine.length+
    (mine.length===1?" mismatch here":" mismatches here")+'</p>';
  if(LIVE){
    h+='<div class="acts"><button class="act sm" id="ask-card">Ask about it</button>';
    if(mine.length) h+='<button class="act sm" id="fix-card">'+(mine.length===1?"Fix it":"Fix all "+mine.length)+'</button>';
    if(n.kind==="module") h+='<button class="sm" id="feature-from">+ Feature using it</button>';
    h+='</div>';
  }

  function chips(title,arr,none){
    if(!arr) return "";
    return '<h3>'+title+' ('+arr.length+')</h3>'+(arr.length
      ? '<div class="chips">'+arr.map(function(d){ return '<span>'+esc(d)+'</span>'; }).join("")+'</div>'
      : '<p class="note">'+none+'</p>');
  }
  if(n.kind==="module"){
    h+=chips("Front door",n.door,"Nothing declared. Every name taken from here is off the door.");
    if(n.stores&&n.stores.length) h+=chips("Owns",n.stores,"");
    if(n.reads&&n.reads.length) h+=chips("Reads",n.reads,"");
  }
  if(n.kind==="feature"){
    h+='<p class="note">In system <b>'+esc(n.system||"none")+'</b></p>';
    h+=chips("Says it uses",n.uses,"No modules named.");
  }
  if(n.kind==="page") h+='<p class="note">'+(n.start?"Start page at ":"At ")+'<b>'+esc(n.route||"no route")+'</b></p>';
  if(n.kind==="store"||n.kind==="trigger"){
    h+=chips(n.kind==="store"?"Shape":"Carries",n.fields,n.kind==="store"?
      "No schema read: add one the owner checks its data against.":"No schema named.");
    if(n.schema) h+='<p class="note">from '+esc(n.schema)+'</p>';
  }

  function list(title,arr,key,want){
    var vis=arr.filter(function(e){ return want(e.kind); });
    if(!vis.length) return "";
    var s='<h3>'+title+' ('+vis.length+')</h3><ul>';
    vis.sort(function(a,b){ return a[key]<b[key]?-1:1; }).forEach(function(e){
      var o=nodes[e[key]];
      var tag = e.kind==="lazy" ? "lazy"
              : e.kind==="import" ? "" : (KINDS[e.kind]||{}).label||e.kind;
      s+='<li><button data-go="'+esc(o.id)+'">'+
         '<span class="dot" style="background:'+
           (e.bad.length?"var(--breach)":isWiring(e.kind)?gcolor(o.group):kcolor(e.kind))+'"></span>'+
         '<span>'+esc(o.label)+'</span>'+
         '<span style="color:var(--muted);margin-left:auto">'+esc(tag)+
         '</span></button>';
      if(e.names.length) s+='<div class="names">'+e.names.map(function(nm){
        return e.bad.indexOf(nm)>=0?'<b>'+esc(nm)+'</b>':esc(nm);
      }).join(", ")+'</div>';
      e.why.forEach(function(w){ s+='<div class="why">'+esc(w)+'</div>'; });
      s+='</li>';
    });
    return s+'</ul>';
  }
  h+=list("Reaches outside",out[n.id],"to",function(k){ return !isInside(k); });
  h+=list(n.kind==="file"?"Imports":"Out",out[n.id],"to",isInside);
  h+=list(n.kind==="file"?"Used by":"In",inn[n.id],"from",isInside);
  panel.innerHTML=h;

  document.getElementById("p-close").addEventListener("click",function(){ select(null); });
  Array.prototype.forEach.call(panel.querySelectorAll("[data-go]"),function(b){
    b.addEventListener("click",function(){
      var id=b.getAttribute("data-go"); select(id); focus(id);
    });
  });
  Array.prototype.forEach.call(panel.querySelectorAll("[data-open]"),function(b){
    b.addEventListener("click",function(){ open(b.getAttribute("data-open")); });
  });
  if(LIVE){
    document.getElementById("ask-card").addEventListener("click",function(){ send(aboutCard(n)); });
    var fx=document.getElementById("fix-card");
    if(fx) fx.addEventListener("click",function(){ send(fixMany(mine,"mismatches in "+n.kind+" "+n.label)); });
    var ff=document.getElementById("feature-from");
    if(ff) ff.addEventListener("click",function(){
      send("Build a new feature that uses the "+n.label+" module: "); });
  }
}

/* -------------------------------------------------------------- talk back
   A served page sends what the person asks to whoever serves it, which puts
   it in Claude Code's chat box. A slash command takes the box's place. */
function send(text){
  if(!LIVE) return;
  fetch(LIVE.ask,{method:"POST",headers:{"Content-Type":"application/json"},
                  body:JSON.stringify({text:text})})
    .then(function(r){ toast(r.ok?"In the chat box — press Enter to send":"Claude Code did not take it"); })
    .catch(function(){ toast("Cannot reach Claude Code: run /codegraph again"); });
}
var toastEl=document.getElementById("toast"), toastTimer=0;
function toast(text){
  toastEl.textContent=text; toastEl.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove("on"); },2600);
}
function fixOne(i){ return "/codegraph:fix "+i.line_text; }
function fixMany(list,what){
  return list.length===1?fixOne(list[0]):"/codegraph:fix all "+list.length+" "+what+", worst first, one commit each";
}
function aboutCard(n){
  var files=(n.files||[]).map(function(f){ var o=FILES[f]; return o?(o.dir==="."?o.label:o.dir+"/"+o.label):f; });
  var where=files.length?"; files "+files.join(", "):"";
  if(n.kind==="feature") return "About the "+n.label+" feature (system "+(n.system||"none")+"; uses "+
    ((n.uses||[]).join(", ")||"no modules")+where+"): ";
  if(n.kind==="module") return "About the "+n.label+" module (front door "+((n.door||[]).join(", ")||"empty")+where+"): ";
  if(n.kind==="page") return "About the "+n.label+" page (at "+(n.route||"no route")+where+"): ";
  if(n.kind==="store") return "About the "+n.label+" store (owned by "+String(n.owner||"?").replace("module:","")+
    "; "+((n.fields||[]).join(", ")||"no schema read")+"): ";
  if(n.kind==="file"){
    var o=FILES[n.id];
    return "About "+(o?(o.dir==="."?o.label:o.dir+"/"+o.label):n.id)+(cur!=="map"?" (in "+V.title+")":"")+": ";
  }
  return "About "+n.label+" ("+n.kind+where+"): ";
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function select(id){ selected=id; render(); drawPanel(); }
function focus(id){
  var r=stage.getBoundingClientRect();
  panX=r.width/2-(pos[id].x+cw(id)/2)*scale;
  panY=r.height/2-(pos[id].y+Math.min(hgt[id],r.height/scale/2)/2)*scale;
  stopZoom(); applyView();
}

/* ------------------------------------------------------------ interactions */
/* Cards picked with a shift-drag box, or shift-clicks, move together. */
var picked={};
function pickedIds(){ return Object.keys(picked).filter(function(k){ return picked[k]; }); }

function drag(el,n){
  var id=null,sx,sy,went=false,hit=null,from={};
  el.addEventListener("pointerdown",function(ev){
    if(ev.button!==0&&ev.pointerType==="mouse") return;
    ev.stopPropagation(); id=ev.pointerId; went=false; hit=ev.target;
    sx=ev.clientX; sy=ev.clientY;
    // dragging a picked card carries the rest of the picked set with it
    from={};
    (picked[n.id]?pickedIds():[n.id]).forEach(function(k){
      if(pos[k]) from[k]={x:pos[k].x,y:pos[k].y};
    });
    el.setPointerCapture(id);
  });
  el.addEventListener("pointermove",function(ev){
    if(id===null||ev.pointerId!==id) return;
    var dx=(ev.clientX-sx)/scale, dy=(ev.clientY-sy)/scale;
    if(!went&&Math.abs(dx)+Math.abs(dy)<3) return;
    went=true;
    Object.keys(from).forEach(function(k){
      pos[k]={x:Math.round(from[k].x+dx),y:Math.round(from[k].y+dy)};
    });
    render();
  });
  el.addEventListener("pointerup",function(ev){
    if(id===null||ev.pointerId!==id) return;
    id=null;
    if(went){
      Object.keys(from).forEach(function(k){ moved[k]=pos[k]; });
      save(posKey(),moved); return;
    }
    if(ev.shiftKey){ picked[n.id]=!picked[n.id]; render(); return; }
    // a click lands on the fold toggle, a file in the list, or the card itself
    var file=hit&&hit.closest("[data-file]");
    if(hit&&hit.closest(".fold")) toggleFold(n.id);
    else if(file){
      var fid=file.getAttribute("data-file");
      if(VIEWS[n.id]&&n.id!==cur) open(n.id);
      if(nodes[fid]){ select(fid); focus(fid); }
    }
    else select(selected===n.id?null:n.id);
  });
  el.addEventListener("pointercancel",function(){ id=null; });
  // pointing at a card lights its wires; nothing else on the map moves
  el.addEventListener("pointerenter",function(ev){
    if(ev.pointerType==="touch"||!focusWires) return;
    hovered=n.id; el.classList.add("hov"); lightWires();
  });
  el.addEventListener("pointerleave",function(){
    el.classList.remove("hov");
    if(hovered!==n.id) return;
    hovered=null; lightWires();
  });
  // a double click goes into a module
  el.addEventListener("dblclick",function(){ if(VIEWS[n.id]&&n.id!==cur) open(n.id); });
  el.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); select(selected===n.id?null:n.id); }
  });
}

/* Dragging empty space pans. With shift held it draws a box instead, and
   every card the box touches joins the picked set. */
(function(){
  var id=null,sx,sy,px,py,boxing=false,before={};
  var box=document.getElementById("marquee");
  function inBox(ev){
    var r=stage.getBoundingClientRect();
    var a={x:Math.min(sx,ev.clientX)-r.left, y:Math.min(sy,ev.clientY)-r.top};
    var b={x:Math.max(sx,ev.clientX)-r.left, y:Math.max(sy,ev.clientY)-r.top};
    box.style.left=a.x+"px"; box.style.top=a.y+"px";
    box.style.width=(b.x-a.x)+"px"; box.style.height=(b.y-a.y)+"px";
    // the box in canvas units, to test against each card
    var x0=(a.x-panX)/scale, y0=(a.y-panY)/scale, x1=(b.x-panX)/scale, y1=(b.y-panY)/scale;
    picked={};
    Object.keys(before).forEach(function(k){ picked[k]=before[k]; });
    order.forEach(function(n){
      var p=pos[n.id];
      if(p.x<x1&&p.x+cw(n.id)>x0&&p.y<y1&&p.y+hgt[n.id]>y0) picked[n.id]=true;
    });
    render();
  }
  stage.addEventListener("pointerdown",function(ev){
    if(ev.target.closest(".card")||ev.target.closest("#panel")||ev.target.closest("#legend")||
       ev.target.closest("#corner")) return;
    stopZoom();
    id=ev.pointerId; sx=ev.clientX; sy=ev.clientY; px=panX; py=panY;
    boxing=ev.shiftKey;
    if(boxing){ before={}; pickedIds().forEach(function(k){ before[k]=true; }); }
    stage.classList.add(boxing?"boxing":"panning"); stage.setPointerCapture(id);
  });
  stage.addEventListener("pointermove",function(ev){
    if(id===null||ev.pointerId!==id) return;
    if(boxing){ box.hidden=false; inBox(ev); return; }
    panX=px+(ev.clientX-sx); panY=py+(ev.clientY-sy); applyView();
  });
  stage.addEventListener("pointerup",function(ev){
    if(id===null||ev.pointerId!==id) return;
    id=null; stage.classList.remove("panning","boxing"); box.hidden=true;
    if(boxing) return;
    // a click on empty space, not the end of a pan, clears the selection
    if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<3){
      picked={};
      if(selected) select(null); else render();
    }
  });
  stage.addEventListener("pointercancel",function(){
    id=null; stage.classList.remove("panning","boxing"); box.hidden=true;
  });
})();

/* The wheel sets a target zoom and each frame closes part of the gap, so a
   notchy mouse wheel glides instead of jumping. The point under the cursor
   stays put the whole way. Panning has no edges. */
var MINZ=0.05, MAXZ=8, zoomTo=1, zx=0, zy=0, wx=0, wy=0, zoomFrame=0;
function stopZoom(){ if(zoomFrame) cancelAnimationFrame(zoomFrame); zoomFrame=0; zoomTo=scale; }
function zoomStep(){
  scale+=(zoomTo-scale)*0.22;
  if(Math.abs(zoomTo-scale)<zoomTo*0.002) scale=zoomTo;
  panX=zx-wx*scale; panY=zy-wy*scale; applyView();
  zoomFrame=scale===zoomTo?0:requestAnimationFrame(zoomStep);
}
stage.addEventListener("wheel",function(ev){
  if(ev.target.closest("#panel")||ev.target.closest("#legend")) return;
  ev.preventDefault();
  var r=stage.getBoundingClientRect();
  zx=ev.clientX-r.left; zy=ev.clientY-r.top;
  wx=(zx-panX)/scale; wy=(zy-panY)/scale;
  var dy=ev.deltaMode===1?ev.deltaY*33:ev.deltaY;   // Firefox reports lines
  zoomTo=Math.max(MINZ,Math.min(MAXZ,zoomTo*Math.exp(-dy*0.0016)));
  if(!zoomFrame) zoomFrame=requestAnimationFrame(zoomStep);
},{passive:false});

function fit(){
  var r=stage.getBoundingClientRect(), b=extent();
  stopZoom();
  scale=zoomTo=Math.max(MINZ,Math.min(1.4,Math.min((r.width-48)/(b.w+40),(r.height-48)/(b.h+40))));
  panX=(r.width-(b.w+40)*scale)/2; panY=(r.height-(b.h+40)*scale)/2; applyView();
}
function openView(){
  var r=stage.getBoundingClientRect(), b=extent();
  stopZoom();
  if(V.blocks){                    // the map is laid out to fit, so show all of it
    scale=zoomTo=Math.max(MINZ,Math.min(1,(r.width-24)/(b.w+40),(r.height-24)/(b.h+40)));
    panX=(r.width-(b.w+40)*scale)/2; panY=12; applyView(); return;
  }
  scale=zoomTo=Math.max(0.4,Math.min(1,(r.height-56)/(b.h+40)));
  panX=22; panY=18; applyView();
}

var bWires=document.getElementById("b-wires");
function wiresLabel(){
  bWires.setAttribute("aria-pressed",String(focusWires));
  bWires.textContent=focusWires?"Wires: on hover":"All wires";
}
bWires.addEventListener("click",function(){
  focusWires=!focusWires; save("wires",focusWires); wiresLabel();
  // every wire is leaving or arriving, so they all draw themselves again
  shownWires={};
  Object.keys(wireEls).forEach(function(k){ plain(wireEls[k]); });
  lightWires();
});
wiresLabel();
document.getElementById("b-fit").addEventListener("click",fit);
document.getElementById("b-reset").addEventListener("click",function(){
  moved={}; save(posKey(),moved); layout(); openView(); render();
});
qbox.addEventListener("input",function(ev){
  query=ev.target.value.trim().toLowerCase();
  if(query){
    var hit=order.filter(hits);
    if(hit.length===1){ select(hit[0].id); focus(hit[0].id); return; }
    if(selected) select(null);
  }
  render();
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Escape"||ev.target===qbox) return;
  if(pickedIds().length){ picked={}; render(); }
  else if(selected) select(null);
  else if(trail.length>1) open(trail[0]);       // Escape climbs back out of a card
});

/* start where this browser left off, else at the top */
(function(){
  var t=load("trail");
  // the file graph is only the fallback now, for a codebase with no modules
  if(t&&t.length&&VIEWS[t[0]]&&VIEWS[t[t.length-1]]&&!(MODS&&t[0]==="files")){
    trail=t; show(t[t.length-1]);
  }
  else open(MODS?"map":"files");
})();

/* served live: the buttons that start new work, and a reload whenever the
   map changes, keeping the card the person had picked */
if(LIVE){
  var make=document.getElementById("make");
  [["+ Feature","Build a new feature: "],["+ Module","Add a new module: "],["+ Page","Add a new page: "]]
    .forEach(function(b){
      var el=document.createElement("button"); el.textContent=b[0];
      el.addEventListener("click",function(){ send(b[1]); });
      make.appendChild(el);
    });
  var again=document.createElement("button"); again.textContent="Refresh";
  again.title="Read the code again";
  again.addEventListener("click",function(){
    toast("Reading the code again…");
    fetch(LIVE.refresh,{method:"POST"}).catch(function(){ toast("Cannot reach Claude Code: run /codegraph again"); });
  });
  make.appendChild(again);
  make.hidden=false;
  openView();                      // the buttons took room from the view it opened on

  try{
    var kept=JSON.parse(sessionStorage.getItem(KEY+".kept")||"null");
    sessionStorage.removeItem(KEY+".kept");
    if(kept&&kept.selected&&nodes[kept.selected]){ select(kept.selected); }
    else if(kept&&kept.listing&&MODS){ listing=true; drawFindings(); }
  }catch(e){}

  var lost=0;
  setInterval(function(){
    fetch(LIVE.version,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(v){
      lost=0;
      if(v.version===LIVE.at) return;
      try{ sessionStorage.setItem(KEY+".kept",JSON.stringify({selected:selected,listing:listing})); }catch(e){}
      location.reload();
    }).catch(function(){ if(++lost===3) toast("Lost Claude Code: run /codegraph to start the map again"); });
  },1500);
}
})();
</script>

  var sys=systemOf(c);
  ed.innerHTML='<div class="ck">new '+esc(c.kind)+(sys?" in "+esc(sys):"")+'</div>'+
    '<input class="cname" type="text" spellcheck="false" placeholder="its name" value="'+esc(c.name||"")+'">'+
    '<textarea class="cabout" placeholder="'+(c.kind==="system"?
      "What should its features do? List them loosely; the agent works out each one.":
      "What is it for? Say it in your own words.")+'">'+esc(c.about||"")+'</textarea>'+
    (c.kind==="page"?'<input class="croute" type="text" spellcheck="false" placeholder="/route, if you know it" value="'+
      esc(c.route||"")+'">'+(d?designHtml(d):"")+
      '<button class="sm cimport" type="button">'+(d?"Change the design…":"Import a design…")+'</button>':"")+
    '<div class="crow"><button class="act sm cdone" type="button">Done</button>'+
    '<span>Enter: next · Esc: done</span></div>';

  Array.prototype.forEach.call(el.children,function(ch){ ch.style.display="none"; });

  function keep(){
    c.name=name.value.trim(); c.about=about.value.trim();
    if(route) c.route=route.value.trim();

  ed.addEventListener("keydown",function(ev){
    ev.stopPropagation();
    if(ev.key==="Escape"||(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey))){ ev.preventDefault(); doneCard(id); return; }

/* Done: a card with nothing said goes; one with no name is named from its
   first words; a name another card has is sent back to be changed */
function doneCard(id){
  var c=sketch&&sketch.cards[id];
  if(!c){ editing=null; return; }
  var ed=cardEls[id]&&cardEls[id].querySelector(".cedit");
  if(ed){
    c.name=ed.querySelector(".cname").value.trim(); c.about=ed.querySelector(".cabout").value.trim();
    var r=ed.querySelector(".croute"); if(r) c.route=r.value.trim();
  }
  if(!c.name&&!c.about&&!sketch.designs[id]){ removeCard(id); return; }
  c.name=slug(c.name||c.about.split(/\s+/).slice(0,3).join(" "))||c.kind;
  var taken=nodes[c.kind+":"+c.name]&&!nodes[c.kind+":"+c.name].draft||
    c.kind==="system"&&frames.some(function(f){ return f.id==="system:"+c.name; })||
    Object.keys(sketch.cards).some(function(o){ return o!==id&&sketch.cards[o].kind===c.kind&&sketch.cards[o].name===c.name; });
  if(taken){
    toast("There is a "+c.kind+" called "+c.name+" already: give this one another name");
    if(ed){ var nm=ed.querySelector(".cname"); nm.value=c.name; nm.focus(); nm.select(); }
    return;
  }
  editing=null; redrawSketch(id);

/* the wire the rules allow between two cards, whichever way it was dragged:
   a module dragged onto a feature is still the feature using the module.
   Only a page leading to a page keeps the way it was drawn. */
function wireBetween(a,b){
  var ka=nodes[a].kind, kb=nodes[b].kind, t=(MODS&&MODS.wiring)||[];
  function find(x,y){ return t.filter(function(w){ return w[0]===x&&w[1]===y; })[0]; }
  var w=find(ka,kb), from=a, to=b;
  if(!w){ w=find(kb,ka); from=b; to=a; }
  if(!w) return null;
  var word=w[2], store=nodes[to];
  // a module writes the store it owns, and reads any other
  if(word==="writes"&&store.owner&&store.owner!=="module:"&&store.owner!==from) word="reads";
  return {from:from,to:to,kind:word};
}
function addWire(a,b){
  var w=wireBetween(a,b);
  if(!w){
    var ka=nodes[a].kind, kb=nodes[b].kind;
    toast("No wire between a "+ka+" and a "+kb+": "+(ka==="feature"&&kb==="feature"
      ?"a feature never calls another; share the work through a module"
      :ka==="store"||kb==="store"?"only a module reaches a store"
      :"the rules have no wire for it"));
    return;
  }
  if(!sketch) sketch=blank();
  var had=sketch.wires.some(function(x){ return x.from===w.from&&x.to===w.to; })||
    edges.some(function(e){ return e.from===w.from&&e.to===w.to&&e.kind===WIRE_KIND[w.kind]; });
  if(had){ toast(nodes[w.from].label+" already "+w.kind+" "+nodes[w.to].label); return; }
  sketch.wires.push(w); redrawSketch(a);
}
function wireDots(el,n){
  if(!drawsHere()||!WIREABLE[n.kind]) return;
  ["left","right"].forEach(function(side){
    var dot=document.createElement("span"); dot.className="port "+side;
    dot.title="Drag onto another card to wire them";
    dot.addEventListener("pointerdown",function(ev){ ev.stopPropagation(); ev.preventDefault(); wireFrom(n.id,side,ev); });
    el.appendChild(dot);
  });
}
function readDesign(file,then){
  var ext=extOf(file.name);
  if(!DESIGN_EXT[ext]){ toast("A design is a picture or an HTML file"); return; }
  if(file.size>DESIGN_MAX){ toast("That file is too big: keep a design under 8 MB"); return; }
  var r=new FileReader();
  r.onload=function(){ then({ext:ext,type:ext===".html"?"text/html":"image",data:r.result,name:file.name}); };
  r.readAsDataURL(file);
}
function hasFiles(ev){ return ev.dataTransfer&&Array.prototype.indexOf.call(ev.dataTransfer.types||[],"Files")>=0; }
/* each page card: the design it has; where a person draws, a place to drop
   one, and on the pages view a dot to drag a link from. A card drawn here
   opens for typing on a double click. */
function pageSketching(el,n){
  var d=n.sketched||(n.design&&LIVE?{url:LIVE.design+n.design,type:designType(n.design)}:null);
  if(d){ el.insertAdjacentHTML("beforeend",designHtml(d)); fillDesigns(el); }
  if(!drawsHere()) return;
  el.addEventListener("dragover",function(ev){
    if(!hasFiles(ev)) return;
    ev.preventDefault(); ev.stopPropagation(); el.classList.add("droppable");
  });
  el.addEventListener("dragleave",function(){ el.classList.remove("droppable"); });
  el.addEventListener("drop",function(ev){
    if(!hasFiles(ev)) return;
    ev.preventDefault(); ev.stopPropagation(); el.classList.remove("droppable");
    readDesign(ev.dataTransfer.files[0],function(design){ giveDesign(n.id,design); });
  });
}
function wireFrom(id,side,ev){
  var line=document.createElementNS(NS,"path");
  line.setAttribute("class","wire planned"); line.setAttribute("stroke","var(--plan)");
  line.setAttribute("stroke-width","2.6"); line.setAttribute("stroke-dasharray","9 6");
  gWires.appendChild(line);
  var a={x:pos[id].x+(side==="left"?0:cw(id)), y:pos[id].y+hgt[id]/2}, out=side==="left"?-1:1;
  function move(e){
    var b=canvasAt(e), k=Math.max(40,Math.abs(b.x-a.x)/2);
    line.setAttribute("d","M"+a.x+" "+a.y+" C"+(a.x+out*k)+" "+a.y+" "+(b.x-out*k)+" "+b.y+" "+b.x+" "+b.y);
  }
  function up(e){
    window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
    if(line.parentNode) line.parentNode.removeChild(line);
    var hit=document.elementFromPoint(e.clientX,e.clientY), card=hit&&hit.closest(".card");
    var to=card&&card.getAttribute("data-id");
    if(to&&to!==id&&nodes[to]) addWire(id,to);
  }
  window.addEventListener("pointermove",move); window.addEventListener("pointerup",up); move(ev);
}
// a design dropped on empty space is a new page there, named after its file
stage.addEventListener("dragover",function(ev){
  if(!drawsHere()||!hasFiles(ev)) return;
  ev.preventDefault(); stage.classList.add("droppable");
});
stage.addEventListener("dragleave",function(ev){ if(ev.target===stage) stage.classList.remove("droppable"); });
stage.addEventListener("drop",function(ev){
  stage.classList.remove("droppable");
  if(!drawsHere()||!hasFiles(ev)) return;
  ev.preventDefault();
  var p=canvasAt(ev);
  readDesign(ev.dataTransfer.files[0],function(design){ newCard("page",p,design); });
});
/* what the panel says about a card drawn here, or a page given a design:
   its design, the links drawn from it, and the ways to change it */
function sketchPanel(n){
  var h='<h3>Drawn here, not sent</h3>', c=sketch&&sketch.cards[n.id];
  if(c){
    if(c.about) h+='<p class="note">'+esc(c.about)+'</p>';
    h+='<div class="acts"><button class="sm" data-edit="1">Edit in the card</button></div>';
  }
  var d=sketch&&sketch.designs[n.id];
  if(d) h+=designHtml(d,"big")+'<div class="drawn"><span>'+esc(d.name||"design")+'</span>'+
    '<button class="sm" data-undesign="1">Remove design</button></div>';
  else if(n.kind==="page") h+='<p class="note">Right-click this page, or drop a screen or an HTML file on it, to give it a design.</p>';
  (sketch?sketch.wires:[]).forEach(function(w,i){
    if(w.from!==n.id&&w.to!==n.id) return;
    h+='<div class="drawn"><span>'+esc(nodes[w.from]?nodes[w.from].label:w.from)+" "+esc(wireWord(w))+" "+
      esc(nodes[w.to]?nodes[w.to].label:w.to)+'</span><button class="sm" data-unlink="'+i+'">×</button></div>';
  });
  if(c) h+='<div class="acts"><button class="sm" data-uncard="1">Remove this '+esc(c.kind)+'</button></div>';
  return h;
}
function bindSketchPanel(n){
  if(!sketchingHere()) return;
  var ed=panel.querySelector("[data-edit]");
  if(ed) ed.addEventListener("click",function(){ editCard(n.id,true); });
  Array.prototype.forEach.call(panel.querySelectorAll("[data-unlink]"),function(b){
    b.addEventListener("click",function(){ sketch.wires.splice(+b.getAttribute("data-unlink"),1); redrawSketch(n.id); });
  });
  var un=panel.querySelector("[data-undesign]");
  if(un) un.addEventListener("click",function(){ delete sketch.designs[n.id]; redrawSketch(n.id); });
  var gone=panel.querySelector("[data-uncard]");
  if(gone) gone.addEventListener("click",function(){ removeCard(n.id); });
}
/* the drawing as a plan: its cards, leads-to wires, and each design as a
   file kept beside the plan */
function sendSketch(v){
  var name=slug(v.name);
  if(!name){ sketchErr="Give the plan a name."; drawSketchForm(); return; }
  if(editing) doneCard(editing);
  var cards={}, designs={}, ids={};
  Object.keys(sketch.cards).forEach(function(id){
    var s=sketch.cards[id], c={kind:s.kind,name:s.name||s.kind};
    ids[id]=s.kind+":"+c.name;
    if(s.about) c.about=s.about;
    if(s.route) c.route=s.route;
    if(systemOf(s)) c.system=systemOf(s);
    cards[id]=c;
  });
  Object.keys(sketch.designs).forEach(function(id){
    var d=sketch.designs[id], label=cards[id]?cards[id].name:id.replace(/^page:/,""), file=slug(label)+d.ext;
    designs[file]=d.data;
    cards[id]=cards[id]||{kind:"page",name:label};
    cards[id].design="plans/"+name+"/"+file;
  });
  var plan={ask:v.ask, drawn:true,
    cards:Object.keys(cards).map(function(id){ return cards[id]; }),
    wires:sketch.wires.map(function(w){ return {from:ids[w.from]||w.from,kind:wireWord(w),to:ids[w.to]||w.to}; })};
  fetch(LIVE.plan,{method:"POST",headers:{"Content-Type":"application/json"},
                   body:JSON.stringify({name:name,plan:plan,designs:designs})})
    .then(function(r){ return r.json().then(function(b){ return {ok:r.ok,body:b}; }); })
    .then(function(a){
      if(!a.ok){ sketchErr=a.body.error||"Claude Code did not take it"; drawSketchForm(); return; }
      sketch=null; sketchForm=null; editing=null; panel.hidden=true; redrawSketch();
      send("/codegraph:plan review "+name);
      fetch(LIVE.refresh,{method:"POST"}).catch(function(){});
    })
    .catch(function(){ sketchErr="Cannot reach Claude Code: run /codegraph again"; drawSketchForm(); });
}

/* start where this browser left off, else at the top */
(function(){
  var t=load("trail");
  // the file graph is only the fallback now, for a codebase with no modules
  if(t&&t.length&&VIEWS[t[0]]&&VIEWS[t[t.length-1]]&&!(MODS&&t[0]==="files")){
    trail=t; show(t[t.length-1]);
  }
  else open(MODS?"map":"files");
})();

/* served live: the buttons that start new work, and a reload whenever the
   map changes, keeping the card the person had picked */
if(LIVE){
  var make=document.getElementById("make");
  if(canSketch()){
    var how=document.createElement("span"); how.className="how";
    how.textContent="Right-click the map to add a card";
    make.appendChild(how);
  }
  var again=document.createElement("button"); again.textContent="↻ Reload";
  again.title="Read the code again, with codegraph as it is now";
  again.addEventListener("click",function(){
    toast("Reading the code again…");
    fetch(LIVE.refresh,{method:"POST"}).catch(function(){ toast("Cannot reach Claude Code: run /codegraph again"); });
  });
  make.appendChild(again);
  make.hidden=false;
  openView();                      // the buttons took room from the view it opened on

  try{
    var kept=JSON.parse(sessionStorage.getItem(KEY+".kept")||"null");
    sessionStorage.removeItem(KEY+".kept");
    if(kept&&kept.selected&&nodes[kept.selected]){ select(kept.selected); }
    else if(kept&&kept.listing&&MODS){ listing=true; drawFindings(); }
    else if(kept&&kept.plans&&MODS){ listingPlans=true; drawPlans(); }
  }catch(e){}

  var lost=0;
  setInterval(function(){
    fetch(LIVE.version,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(v){
      lost=0;
      if(v.version===LIVE.at) return;
      try{ sessionStorage.setItem(KEY+".kept",JSON.stringify({selected:selected,listing:listing,plans:listingPlans})); }catch(e){}
      location.reload();
    }).catch(function(){ if(++lost===3) toast("Lost Claude Code: run /codegraph to start the map again"); });
  },1500);
}
})();
</script>
